# portl.toml — local agent + CLI configuration
#
# Lives at $PORTL_HOME/config/portl.toml. All values are optional; missing
# keys fall back to env vars (PORTL_*), then compiled defaults.
#
# Precedence (high → low):
#   1. CLI flags
#   2. Environment variables
#   3. This file
#   4. Compiled defaults
#
# Reload semantics: settings are read at agent startup. Edit + restart
# the agent to apply changes:
#   macOS:  launchctl kickstart -k gui/$(id -u)/com.portl.agent
#   Linux:  systemctl --user restart portl-agent.service

schema = 1

[agent]
# Socket address to bind the QUIC listener on. "[::]:0" picks a random
# port on all interfaces (recommended; relay/holepunch handles the
# rest). Pin to a specific port if you're punching through static NAT
# rules.
# listen_addr = "[::]:0"

# Preferred persistent-session provider. Supported values:
#   default  — ghostty (the compiled default)
#   ghostty  — built-in Ghostty-backed sessions
#   zmx      — target-side zmx CLI
#   tmux     — target-side tmux control mode
# session_provider = "default"
# session_provider_path = "/usr/local/bin/zmx"  # zmx/tmux CLI override

[agent.discovery]
# How peers find us (publish) and how we find them (resolve).
# Disable with dns = false, pkarr = false, local = false, relays = [].
dns   = true     # resolve TXT records via n0's DNS origin
pkarr = true     # publish + resolve signed records over HTTP(S), not Mainline DHT
local = true     # mDNS on the local network

# DNS/pkarr accept true (built-in default), false (disabled), "default",
# one endpoint string, or an ordered list. [] disables; duplicates are removed.
# Custom lists replace defaults unless "default" is explicitly included.
# All lookup services run concurrently: order is NOT fallback priority.
# DNS entries are origins, optionally @IP or @IP:port (default port 53).
# IPv6 nameservers: origin@::1 or origin@[::1]:5353.
# The override affects that DNS lookup only, not relay/pkarr hostname resolution.
# dns = ["default", "discovery.example@192.0.2.53:5353"]
# pkarr = ["default", "https://discovery.example/pkarr"]
# Pkarr URLs must use http(s) with a host and no credentials/query/fragment.
# Existing relay URL parsing is unchanged. Ordinary dial clients resolve only;
# pairing preserves stable agent-style publication and mDNS advertising.
# Agents publish to every configured pkarr endpoint.
# PORTL_DISCOVERY replaces the entire section, e.g.:
#   dns,pkarr:https://discovery.example/pkarr,dns:discovery.example@192.0.2.53,local,relay
# Each custom prefix accepts ':' or '='. Bare dns/pkarr/relay use built-ins.
# See docs/DISCOVERY.md for local-network policy configuration.

# Ordered list of relays. Each entry is one of:
#   "default"               — iroh's built-in n0 relay(s)
#   "https://<host>/"       — explicit URL (your own relay or any
#                             other reachable iroh-relay endpoint)
# Empty list = relay disabled (peers must hole-punch or be on LAN).
relays = ["default"]

# To scope mDNS, REMOVE local = true above and uncomment this table:
# [agent.discovery.local]
# enabled = true
# deny = [{ ssid = "TCB-BYOD" }, { subnet = "10.61.176.0/20" }]
# allow = [] # if nonempty, every active interface must match an allow
# unknown = "deny" # default with any rule; no rules default to allow
# Matchers: ssid, interface (exact name), subnet (IPv4/IPv6 address CIDR).
# Fields within one rule are ANDed; separate rules ORed. Deny wins.
# A redacted SSID is unknown, NOT a known nonmatch. On macOS 14+ a
# standalone LaunchAgent may not have Location Services authorization.
# For home access without SSIDs, use interface/subnet rules instead.
# Policy changes automatically on OS network events, with a 10-second
# identity recheck for SSID-only roams. It gates all mDNS interfaces.

[agent.rate_limit]
# Token-bucket on inbound ticket-accept attempts. Defaults are quite
# tight; bump for trusted networks.
# rps   = 1
# burst = 10

[agent.udp]
# Idle seconds before a UDP forwarder session is reaped.
# session_linger_secs = 60

[network]
# HTTP proxy for every outbound HTTP(S) path portl uses: the iroh relay
# connection, pkarr publish/resolve, net-report probes, and short-code
# rendezvous. Only http:// proxies (HTTP CONNECT) are supported;
# user:pass@ credentials are sent as Proxy-Authorization.
#
# Unset (default): honor HTTPS_PROXY / ALL_PROXY / HTTP_PROXY / NO_PROXY.
# Overridden by PORTL_PROXY and by the --proxy / --no-proxy flags.
#
# Proxy-only sandbox (direct TCP egress is blocked):
# proxy = "http://user:pass@egress-proxy:3128"
#
# Force direct connections even when HTTPS_PROXY etc. are set:
# proxy = "direct"

# [cli] section reserved for future use.
# [cli]
