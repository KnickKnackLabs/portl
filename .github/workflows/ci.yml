name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel obsolete PR runs; keep every main commit available to the release gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Release is a separate workflow (.github/workflows/release.yml) that
# fires on `v*` tag pushes. It gates on this workflow's conclusion
# for the tagged SHA via a `gh run watch` preflight, so we never
# duplicate CI between a main push and a tag push pointing at the
# same commit.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # CI checks release compilation and linking without expensive cross-crate LTO.
  # Published artifacts still use Cargo.toml's full release profile.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  # .cargo/config.toml sets `rustc-wrapper = "sccache"`. Every cargo
  # invocation below needs sccache on PATH; mozilla-actions/sccache-
  # action installs it and wires the GitHub Actions cache backend via
  # this env var. `fmt` and `deny` don't invoke rustc, so they skip
  # the action.
  SCCACHE_GHA_ENABLED: "true"
  # Per-test-binary watchdog (see crates/portl-agent/tests/common/mod.rs).
  # Default is 30s for local laptops; CI runs on 2-CPU shared runners
  # under parallel test load, where UDP loopback stress tests can push
  # past the default. 90s is well above nextest's 40s per-test slow-
  # timeout, so the watchdog remains a true backstop rather than the
  # primary limit.
  PORTL_TEST_WATCHDOG_SECS: "90"

# Caching strategy (see docs/specs/ for context):
#  - `actions-rust-lang/setup-rust-toolchain` installs the toolchain
#    pinned in rust-toolchain.toml (1.93.0) and wraps
#    `Swatinem/rust-cache` so we get bulk dep caching (~/.cargo +
#    target/) keyed by Cargo.lock + rustc version. Fast restore on
#    the same lockfile.
#  - `mozilla-actions/sccache-action` installs sccache and points its
#    GHA backend at the Actions cache. Our `.cargo/config.toml` wires
#    `rustc-wrapper = "sccache"`, so every rustc invocation gets per-
#    compilation-unit caching on top of Swatinem's dep blob. sccache
#    survives lockfile churn and hits individual crates even when
#    the tree drifts.
#  - `cache-save-if: refs/heads/main` restricts cache writes to main
#    pushes; PR branches only read main's cache — keeps us under the
#    10 GB repo budget.
#  - `cache-on-failure: true` saves the cache even when the job
#    fails. Safe because Swatinem's pre-save clean strips workspace
#    crates + incremental artifacts; only successfully-compiled
#    deps survive. Gives warm-cache recovery on flaky test runs.
#
# Job topology:
#  - `test` compiles all-targets in test cfg → subsumes `cargo check`.
#  - `clippy` compiles all-targets with the clippy driver → also
#    subsumes `cargo check`. A dedicated `check` job would be a
#    strictly-weaker duplicate, so it is omitted.
#  - `fmt` and `deny` stay separate: neither invokes rustc, both
#    are <30 s, and they surface orthogonal red-X signals on PRs.

jobs:
  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # cargo-nextest gives us per-test slow-timeout + terminate-after
      # (see .config/nextest.toml profile.ci). Failures include the
      # specific test name instead of a bare 'process aborted', and
      # integration test binaries run in parallel instead of serially.
      #
      # taiki-e/install-action downloads prebuilt nextest binaries
      # from the nexte.st CDN — no `cargo install` compile step, so
      # no MSRV coupling between our pinned 1.93 toolchain and
      # nextest's own MSRV. Takes ~5 s vs minutes for a cold
      # source build.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test CI helper scripts
        run: |
          scripts/tests/nextest-threads-test.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Select nextest threads
        run: |
          threads=$(scripts/nextest-threads.sh)
          echo "NEXTEST_TEST_THREADS=${threads}" >> "$GITHUB_ENV"
          echo "Selected nextest threads: ${threads}"
      - run: cargo nextest run --locked --profile ci --workspace --lib --bins --tests
      - uses: actions/upload-artifact@v7
        with:
          name: portl-ci-cli
          path: target/debug/portl
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo fmt does not invoke rustc; skip the cache entirely and
      # only install rustfmt. Job finishes in ~15 s cold.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check non-Ghostty optional features
        run: |
          set -euo pipefail
          cargo check --locked -p portl-agent --features test-panic-trigger --all-targets
          cargo check --locked -p portl-core --features test-util --all-targets
      - name: Forbid unwrapped spawn_blocking in portl-agent
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import sys

          offenders = []
          for path in Path("crates/portl-agent").rglob("*.rs"):
              lines = path.read_text().splitlines()
              for i, line in enumerate(lines):
                  if "spawn_blocking" not in line:
                      continue
                  start = max(0, i - 3)
                  end = min(len(lines), i + 4)
                  if not any("slow_task" in candidate for candidate in lines[start:end]):
                      offenders.append(f"{path}:{i + 1}: {line.strip()}")
          if offenders:
              print("::error ::every portl-agent spawn_blocking callsite must be wrapped with slow_task")
              print("\n".join(offenders))
              sys.exit(1)
          print("OK: all portl-agent spawn_blocking callsites are wrapped with slow_task")
          PY

  ghostty-smoke:
    name: ghostty smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: "ghostty-smoke"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install Zig for Ghostty static smoke
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Select nextest threads
        run: |
          threads=$(scripts/nextest-threads.sh)
          echo "NEXTEST_TEST_THREADS=${threads}" >> "$GITHUB_ENV"
          echo "Selected nextest threads: ${threads}"
      # Only session_e2e has Ghostty-gated integration coverage. Keep --tests so
      # every integration target still compiles with the feature without rerunning
      # the feature-independent suite already covered by the primary test job.
      - run: cargo nextest run --locked --profile ci -p portl-agent --features ghostty-vt-static --lib --tests -E '(kind(lib) + binary(=session_e2e))'
      - run: cargo nextest run --locked --profile ci -p portl-cli --features ghostty-vt-static -E 'binary(=ghostty_smoke)'
      - run: cargo clippy --locked -p portl-agent -p portl-cli --features ghostty-vt-static --all-targets -- -D warnings

  ghostty-musl-smoke:
    name: ghostty musl smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: "ghostty-musl-smoke-${{ matrix.target }}"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install Zig for Ghostty musl static smoke
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: rustup target add ${{ matrix.target }}
      - name: Build static musl binary
        run: |
          cargo zigbuild --locked \
            --release \
            --package portl-cli \
            --target "${{ matrix.target }}" \
            --features ghostty-vt-static \
            --bin portl
      - name: Inspect static binary
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/portl"
          test -x "${binary}"
          file "${binary}"
          if ldd_output=$(ldd "${binary}" 2>&1); then
            printf '%s\n' "${ldd_output}"
            grep -Eiq 'statically linked|not a dynamic executable' <<<"${ldd_output}"
          else
            printf '%s\n' "${ldd_output}"
            grep -Eiq 'statically linked|not a dynamic executable' <<<"${ldd_output}"
          fi
      - name: Run in scratch container
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "${tmpdir}"' EXIT
          cp "target/${{ matrix.target }}/release/portl" "${tmpdir}/portl"
          printf 'FROM scratch\nCOPY portl /portl\nENTRYPOINT ["/portl"]\n' > "${tmpdir}/Dockerfile"
          image="portl-ghostty-scratch-smoke:${{ matrix.target }}"
          docker build --platform "${{ matrix.platform }}" -t "${image}" "${tmpdir}"
          docker run --rm --platform "${{ matrix.platform }}" "${image}" --version
          docker run --rm --platform "${{ matrix.platform }}" "${image}" __ghostty-smoke

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    # cargo-deny only reads Cargo.lock / Cargo.toml, but the underlying
    # `cargo metadata` call honors rust-toolchain.toml and the
    # rustc-wrapper from .cargo/config.toml. The rustc-wrapper is
    # cleared because sccache isn't installed in this job — cargo-deny
    # doesn't benefit from it and installing it here would waste time.
    # `cache: false` on setup-rust-toolchain skips Swatinem since
    # cargo-deny doesn't compile our workspace; baptiste0928/
    # cargo-install already caches the cargo-deny binary.
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      # Prebuilt cargo-deny binary from GitHub releases; avoids
      # compiling from source with our pinned toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked --all-features check

  portl-ffi-apple:
    name: portl ffi Apple xcframework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: "portl-ffi-apple"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install Apple Rust targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            aarch64-apple-darwin
      - name: Build PortlFFI Apple xcframework
        run: ./scripts/build-portl-ffi-xcframework.sh --out dist/apple
      - uses: actions/upload-artifact@v7
        with:
          name: portl-ffi-apple-xcframework
          path: dist/apple/PortlFFI.xcframework

  docker-smoke:
    name: docker integration smoke
    needs: [test, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # nextest already built the real CLI for its subprocess integration tests.
      - uses: actions/download-artifact@v8
        with:
          name: portl-ci-cli
          path: ci-bin
      - name: Build reference Docker image
        run: |
          chmod +x ci-bin/portl
          mkdir -p adapters/docker-portl/images/bin
          cp ci-bin/portl adapters/docker-portl/images/bin/portl-amd64
          docker build \
            --platform linux/amd64 \
            -t portl-agent:ci \
            --build-arg TARGETARCH=amd64 \
            -f adapters/docker-portl/images/Dockerfile.reference \
            adapters/docker-portl/images/
      - name: Docker adapter end-to-end smoke
        run: |
          PORTL_HOME="$(mktemp -d)"
          export PORTL_HOME
          ./ci-bin/portl init
          ./ci-bin/portl docker run portl-agent:ci --name t1 --env PORTL_REFERENCE_MODE=idle
          ./ci-bin/portl docker run portl-agent:ci --name t2 --env PORTL_REFERENCE_MODE=idle

          docker exec t1 sh -c 'test -x /usr/local/bin/portl-agent'
          docker exec t2 sh -c 'test -x /usr/local/bin/portl-agent'

          ./ci-bin/portl docker detach t1
          ./ci-bin/portl docker attach t1

          ./ci-bin/portl docker rm t1 --force
          ./ci-bin/portl docker rm t2 --force
