name: Release

# Fires on `v*` tag pushes. Gated on `ci.yml` being green for the
# tagged SHA (see `ci-gate` job) — we never re-run CI on the tag, so
# tagging a commit that already passed main-CI costs only one extra
# workflow run (Release) instead of a duplicated CI matrix.
#
# Requirements before pushing a `v*` tag:
#  - The tagged commit has a green run of `ci.yml` on the same SHA.
#    (Usually true because you tag a commit that already landed on
#    main. If not, `ci-gate` polls for up to 30 min waiting for a
#    CI run to appear and complete.)
#  - CHANGELOG.md has a matching `## <version> — YYYY-MM-DD` section
#    for the tag. `release-publish` extracts that section as the
#    GitHub release body and fails if it's missing.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SCCACHE_GHA_ENABLED: "true"
  APPLE_CODESIGN_VERSION: "0.29.0"

jobs:
  ci-gate:
    # One parallel gate job per required CI check. Matrix legs run
    # concurrently, so if any check fails, `fail-fast: true` cancels
    # the other legs instead of waiting on the slowest to finish.
    # `release-build` depends on `ci-gate`, and `needs:` against a
    # matrix job requires every leg to succeed before downstream
    # jobs start.
    #
    # `matrix.check` values must match the `name:` fields on the
    # corresponding jobs in ci.yml exactly. If you rename a CI job,
    # update the matching entry here or the gate will hang until
    # timeout waiting for a check that will never appear.
    name: wait for `${{ matrix.check }}`
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        check:
          - cargo nextest
          - rustfmt
          - clippy
          - ghostty smoke
          - ghostty musl smoke (x86_64-unknown-linux-musl)
          - ghostty musl smoke (aarch64-unknown-linux-musl)
          - cargo deny
          - dep-guard
          - docker integration smoke
    steps:
      - id: wait
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.check }}
          ref: ${{ github.sha }}
          timeoutSeconds: 1800
          intervalSeconds: 15
      # fountainhead/action-wait-for-check exits 0 on both
      # `conclusion: success` AND timeout/failure (it only sets the
      # `conclusion` output). Assert explicitly so a non-success
      # conclusion fails this leg and, via fail-fast, cancels the
      # rest of the gate.
      - name: Assert `${{ matrix.check }}` concluded success
        env:
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error ::CI check '$CHECK' conclusion was '$CONCLUSION' (expected 'success')"
            exit 1
          fi
          echo "OK: $CHECK -> $CONCLUSION"

  release-linux-build:
    name: release linux build (${{ matrix.target }})
    needs: [ci-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-shared-key: "release-${{ matrix.target }}"
          cache-save-if: true
          cache-on-failure: true
      - name: Install zig for Ghostty static link
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build linux musl via zigbuild
        run: cargo zigbuild --release --package portl-cli --target ${{ matrix.target }} --features ghostty-vt-static --bin portl
      - name: Package linux tarballs
        run: |
          set -euo pipefail
          mkdir -p dist staging
          NAME="portl-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "staging/${NAME}"
          cp "target/${{ matrix.target }}/release/portl" "staging/${NAME}/portl"
          (
            cd "staging/${NAME}"
            ln -sf portl portl-agent
            ln -sf portl portl-gateway
            ln -sf portl portl-ssh
            test -L portl-agent
            test -L portl-gateway
            test -L portl-ssh
          )
          cp LICENSE-MIT CHANGELOG.md "staging/${NAME}/"
          tar -C staging --use-compress-program='zstd -19 -T0 --long' -cf "dist/${NAME}.tar.zst" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.zst" > "${NAME}.tar.zst.sha256")
          tar -C staging -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - uses: actions/upload-artifact@v5
        with:
          name: release-linux-${{ matrix.target }}
          path: dist/*

  release-macos-build:
    name: release macOS build (${{ matrix.target }})
    needs: [ci-gate]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-shared-key: "release-${{ matrix.target }}"
          cache-save-if: true
          cache-on-failure: true
      - name: Install zig for Ghostty static link
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build macOS native
        run: cargo build --release --package portl-cli --target ${{ matrix.target }} --features ghostty-vt-static --bin portl
      - name: Upload raw macOS binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/portl" dist/portl
      - uses: actions/upload-artifact@v5
        with:
          name: raw-macos-${{ matrix.target }}
          path: dist/portl

  release-publish:
    name: publish GitHub release
    needs: [release-linux-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      # Extract only the CHANGELOG section matching this tag's version
      # so the GitHub release body shows what's new in this release,
      # not the full file. CHANGELOG.md uses Keep-a-Changelog style
      # headings like "## 0.3.1 — 2026-04-23"; we match on the second
      # whitespace-delimited token after `## `. Fail if no section
      # exists for the tag — tagging without a CHANGELOG entry is
      # almost always a mistake.
      - name: Extract release notes for ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v ver="$version" '
            /^## / {
              if (in_section) exit
              if ($2 == ver) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error ::no CHANGELOG.md section found for version $version"
            echo "::error ::add a '## $version — YYYY-MM-DD' heading to CHANGELOG.md before tagging"
            exit 1
          fi
          echo "--- release notes for $TAG ---"
          cat release-notes.md
          echo "--- end release notes ---"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: portl ${{ github.ref_name }}
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true

  release-macos-sign-notarize:
    name: sign/notarize macOS (${{ matrix.target }})
    needs: [release-macos-build, release-publish]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: raw-macos-${{ matrix.target }}
          path: raw
      - name: Install rcodesign
        run: |
          set -euo pipefail
          if command -v rcodesign >/dev/null 2>&1 && rcodesign --version 2>/dev/null | grep -q "$APPLE_CODESIGN_VERSION"; then
            rcodesign --version
            exit 0
          fi
          tmp=$(mktemp -d)
          cd "$tmp"
          arch="x86_64-unknown-linux-musl"
          if [ "$(uname -m)" = "aarch64" ]; then
            arch="aarch64-unknown-linux-musl"
          fi
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${APPLE_CODESIGN_VERSION}/apple-codesign-${APPLE_CODESIGN_VERSION}-${arch}.tar.gz"
          curl -sSL -o rcodesign.tar.gz "$url"
          tar xzf rcodesign.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv "apple-codesign-${APPLE_CODESIGN_VERSION}-${arch}/rcodesign" "$HOME/.local/bin/rcodesign"
          chmod +x "$HOME/.local/bin/rcodesign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rcodesign" --version
      - name: Install Linux pkg builder tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cpio \
            git \
            gzip \
            libssl-dev \
            libtool \
            libxml2-dev \
            make \
            pkg-config \
            zlib1g-dev \
            zstd

          git clone --depth 1 https://github.com/mackyle/xar.git "$RUNNER_TEMP/xar"
          git -C "$RUNNER_TEMP/xar" fetch --depth 1 origin 66d451dab1ef859dd0c83995f2379335d35e53c9
          git -C "$RUNNER_TEMP/xar" checkout 66d451dab1ef859dd0c83995f2379335d35e53c9
          (
            cd "$RUNNER_TEMP/xar/xar"
            ./autogen.sh --noconfigure
            ./configure --prefix=/usr/local
            make -j"$(nproc)"
            sudo make install
          )
          sudo ldconfig

          git clone --depth 1 https://github.com/hogliux/bomutils.git "$RUNNER_TEMP/bomutils"
          git -C "$RUNNER_TEMP/bomutils" fetch --depth 1 origin c247002e2f49878bab32dd0fcf805810ae0992cb
          git -C "$RUNNER_TEMP/bomutils" checkout c247002e2f49878bab32dd0fcf805810ae0992cb
          make -C "$RUNNER_TEMP/bomutils" all
          echo "$RUNNER_TEMP/bomutils/build/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bomutils/build/bin/mkbom" -h || true
          xar --version || true
          xar --help 2>&1 | grep -q -- '--no-compress'
      - name: Pull Portl signing assets
        env:
          SIGNING_REPO_DEPLOY_KEY: ${{ secrets.SIGNING_REPO_DEPLOY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_REPO_DEPLOY_KEY:?SIGNING_REPO_DEPLOY_KEY secret is required for macOS release signing}"
          : "${MATCH_PASSWORD:?MATCH_PASSWORD secret is required for macOS release signing}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          keyfile="$HOME/.ssh/signing_repo_deploy_key"
          printf '%s\n' "$SIGNING_REPO_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -t ed25519,rsa,ecdsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null

          signing_dir="$RUNNER_TEMP/signing"
          rm -rf "$signing_dir"
          GIT_SSH_COMMAND="ssh -i '$keyfile' -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:unstableneutron/signing-certs.git "$signing_dir"

          pw=$(mktemp)
          printf '%s' "$MATCH_PASSWORD" > "$pw"
          chmod 600 "$pw"
          for f in "$signing_dir"/portl/*.enc; do
            out="${f%.enc}"
            openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -out "$out" -pass "file:$pw"
          done
          rm -f "$pw"
          chmod 600 \
            "$signing_dir"/portl/developer_id_application.p12 \
            "$signing_dir"/portl/p12-password \
            "$signing_dir"/portl/developer_id_installer.p12 \
            "$signing_dir"/portl/installer-p12-password

          echo "PORTL_SIGNING_P12=$signing_dir/portl/developer_id_application.p12" >> "$GITHUB_ENV"
          echo "PORTL_SIGNING_P12_PASSWORD_FILE=$signing_dir/portl/p12-password" >> "$GITHUB_ENV"
          echo "PORTL_INSTALLER_P12=$signing_dir/portl/developer_id_installer.p12" >> "$GITHUB_ENV"
          echo "PORTL_INSTALLER_P12_PASSWORD_FILE=$signing_dir/portl/installer-p12-password" >> "$GITHUB_ENV"

          echo "Developer ID Application certificate:"
          rcodesign analyze-certificate \
            --p12-file "$signing_dir/portl/developer_id_application.p12" \
            --p12-password-file "$signing_dir/portl/p12-password" | sed -n '1,24p'
          echo "Developer ID Installer certificate:"
          rcodesign analyze-certificate \
            --p12-file "$signing_dir/portl/developer_id_installer.p12" \
            --p12-password-file "$signing_dir/portl/installer-p12-password" | sed -n '1,24p'
      - name: Prepare App Store Connect API key for rcodesign
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?ASC_KEY_ID secret is required for macOS notarization}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID secret is required for macOS notarization}"
          : "${ASC_PRIVATE_KEY_B64:?ASC_PRIVATE_KEY_B64 secret is required for macOS notarization}"

          key_path="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          api_json="$RUNNER_TEMP/appstore-api-key.json"
          rcodesign encode-app-store-connect-api-key "$ASC_ISSUER_ID" "$ASC_KEY_ID" "$key_path" --output-path "$api_json"
          chmod 600 "$api_json"
          echo "PORTL_NOTARY_API_KEY=$api_json" >> "$GITHUB_ENV"
      - name: Sign macOS binary and package tarballs
        env:
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          NAME="portl-${{ github.ref_name }}-${{ matrix.target }}"
          signed_dir="$RUNNER_TEMP/${NAME}"
          mkdir -p "$signed_dir" dist staging
          install -m 0755 raw/portl "$signed_dir/portl"
          rcodesign sign \
            --p12-file "$PORTL_SIGNING_P12" \
            --p12-password-file "$PORTL_SIGNING_P12_PASSWORD_FILE" \
            --binary-identifier com.un.portl \
            --info-plist-file crates/portl-cli/resources/macos/PortlInfo.plist \
            --for-notarization \
            "$signed_dir/portl"
          rcodesign print-signature-info "$signed_dir/portl" | sed -n '1,40p'

          mkdir -p "staging/${NAME}"
          cp "$signed_dir/portl" "staging/${NAME}/portl"
          (
            cd "staging/${NAME}"
            ln -sf portl portl-agent
            ln -sf portl portl-gateway
            ln -sf portl portl-ssh
          )
          cp LICENSE-MIT CHANGELOG.md "staging/${NAME}/"
          tar -C staging --use-compress-program='zstd -19 -T0 --long' -cf "dist/${NAME}.tar.zst" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.zst" > "${NAME}.tar.zst.sha256")
          tar -C staging -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "PORTL_SIGNED_BINARY=$signed_dir/portl" >> "$GITHUB_ENV"
      - name: Attach signed macOS tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.zst
            dist/*.tar.zst.sha256
          fail_on_unmatched_files: true
      - name: Build signed notarized home pkg
        run: |
          set -euo pipefail
          NAME="portl-${{ github.ref_name }}-${{ matrix.target }}"
          PKG_VERSION="${{ github.ref_name }}"
          PKG_VERSION="${PKG_VERSION#v}"
          scripts/build-macos-home-pkg.sh \
            --binary "$PORTL_SIGNED_BINARY" \
            --version "$PKG_VERSION" \
            --target "${{ matrix.target }}" \
            --out dist \
            --name "$NAME"
          rcodesign sign \
            --p12-file "$PORTL_INSTALLER_P12" \
            --p12-password-file "$PORTL_INSTALLER_P12_PASSWORD_FILE" \
            --for-notarization \
            "dist/${NAME}.pkg"
          rcodesign notary-submit \
            --api-key-file "$PORTL_NOTARY_API_KEY" \
            --wait \
            --staple \
            --max-wait-seconds 3600 \
            "dist/${NAME}.pkg"
          (cd dist && shasum -a 256 "${NAME}.pkg" > "${NAME}.pkg.sha256")
      - name: Attach notarized macOS pkg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.pkg
            dist/*.pkg.sha256
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: signed-macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: ignore
