name: Resolve dependency upgrade

on:
  push:
    branches: [codex/update-stable-dependencies]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTC_WRAPPER: ""
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: cargo update
      - name: Capture resolved lockfile
        run: |
          echo PORTL_LOCKFILE_BEGIN
          cat Cargo.lock
          echo PORTL_LOCKFILE_END
