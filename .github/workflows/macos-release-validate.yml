name: Validate macOS Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, e.g. v0.10.3
        required: true
        type: string
      install_current_user:
        description: Install pkg into the runner user's home directory
        required: false
        type: boolean
        default: false

jobs:
  validate-macos-assets:
    name: validate macOS release assets
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Install validation tools
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi
      - name: Download macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*-apple-darwin.pkg' \
            --pattern '*-apple-darwin.pkg.sha256' \
            --pattern '*-apple-darwin.tar.gz' \
            --pattern '*-apple-darwin.tar.gz.sha256' \
            --pattern '*-apple-darwin.tar.zst' \
            --pattern '*-apple-darwin.tar.zst.sha256' \
            --dir dist
          ls -la dist
      - name: Validate tarball signatures and native launch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/*.tar.gz dist/*.tar.zst)
          if [ "${#tarballs[@]}" -ne 4 ]; then
            echo "::error ::expected 4 macOS tarballs, found ${#tarballs[@]}"
            printf 'found: %s\n' "${tarballs[@]}"
            exit 1
          fi

          native_target=""
          case "$(uname -m)" in
            arm64) native_target="aarch64-apple-darwin" ;;
            x86_64) native_target="x86_64-apple-darwin" ;;
          esac

          for archive in "${tarballs[@]}"; do
            echo "== $archive =="
            (cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$archive").sha256")

            name="$(basename "$archive")"
            dir="${name%.tar.gz}"
            dir="${dir%.tar.zst}"
            extract_dir="$(mktemp -d)"
            case "$archive" in
              *.tar.zst) zstd -dc "$archive" | tar -xf - -C "$extract_dir" ;;
              *) tar -xf "$archive" -C "$extract_dir" ;;
            esac
            root="$extract_dir/$dir"
            binary="$root/portl"

            test -x "$binary"
            test "$(readlink "$root/portl-agent")" = portl
            test "$(readlink "$root/portl-gateway")" = portl
            test "$(readlink "$root/portl-ssh")" = portl
            codesign --verify --verbose=4 "$binary"
            codesign -dvvv "$binary" 2>&1 | tee "${archive}.codesign"
            grep -F 'Authority=Developer ID Application: Sherlock Technologies Inc (NM7NK4ZVD4)' "${archive}.codesign"
            grep -F 'TeamIdentifier=NM7NK4ZVD4' "${archive}.codesign"
            grep -E 'flags=.*runtime' "${archive}.codesign"

            # Standalone Mach-O CLI tools can be notarized but cannot have
            # tickets stapled to the raw executable. Exercise the native tarball
            # payload under quarantine so Gatekeeper can consult the notary
            # service for the submitted binary hash.
            if [ -n "$native_target" ] && [[ "$dir" == *"$native_target" ]]; then
              xattr -w com.apple.quarantine \
                "0081;$(printf '%x' "$(date +%s)");GitHubActions;https://github.com/KnickKnackLabs/portl/releases/download/${TAG}/${name}" \
                "$binary"
              "$binary" --version | grep -Fx "portl ${TAG#v}"
            fi
          done
      - name: Validate pkg signatures, notarization, and payloads
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/*.pkg)
          if [ "${#pkgs[@]}" -ne 2 ]; then
            echo "::error ::expected 2 macOS pkg assets, found ${#pkgs[@]}"
            printf 'found: %s\n' "${pkgs[@]}"
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            echo "== $pkg =="
            (cd "$(dirname "$pkg")" && shasum -a 256 -c "$(basename "$pkg").sha256")
            pkgutil --check-signature "$pkg"
            xcrun stapler validate "$pkg"
            spctl --assess --type install -vv "$pkg"
            pkgutil --payload-files "$pkg" | tee "${pkg}.payload-files"
            grep -Fx './.local/bin/portl' "${pkg}.payload-files"
            grep -Fx './.local/bin/portl-agent' "${pkg}.payload-files"
            grep -Fx './.local/bin/portl-gateway' "${pkg}.payload-files"
            grep -Fx './.local/bin/portl-ssh' "${pkg}.payload-files"
          done
      - name: Install into current user home
        if: inputs.install_current_user
        run: |
          set -euo pipefail
          for pkg in dist/*.pkg; do
            echo "installing $pkg into CurrentUserHomeDirectory"
            installer -pkg "$pkg" -target CurrentUserHomeDirectory -verboseR
          done
          "$HOME/.local/bin/portl" --version
          "$HOME/.local/bin/portl-agent" --version
